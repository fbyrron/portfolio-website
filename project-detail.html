<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Details - Ernest Byrron Flores</title>
    <link rel="stylesheet" href="styles.css">
    <script>
        // Apply saved theme immediately to prevent flash
        (function() {
            var t = localStorage.getItem('theme') || 'dark';
            document.documentElement.setAttribute('data-theme', t);
        })();
    </script>
</head>
<body>
    <canvas id="particles"></canvas>
    
    <header>
        <div class="logo"><a href="index.html" style="text-decoration:none;color:inherit;background:linear-gradient(135deg, var(--primary), var(--secondary));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;">EBF</a></div>
        <button class="theme-toggle" aria-label="Toggle dark/light mode" onclick="toggleTheme()">
            <div class="toggle-switch">
                <div class="toggle-track"></div>
                <div class="toggle-stars">
                    <span></span><span></span><span></span><span></span><span></span>
                </div>
                <div class="toggle-clouds">
                    <span></span><span></span><span></span><span></span><span></span>
                </div>
                <div class="toggle-knob"></div>
            </div>
        </button>
    </header>

    <main>
        <section id="project-detail-section">
            <div class="back-button-container">
                <a href="index.html#projects" class="back-button">← Back to Projects</a>
            </div>
            
            <div id="project-detail-content">
                <!-- Content will be loaded by JavaScript -->
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Ernest Byrron Flores. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
    <script src="project-detail.js"></script>
</body>
</html>
